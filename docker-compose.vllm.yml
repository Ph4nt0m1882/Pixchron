version: '3.8'

services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: pixchron_vllm
    ipc: host
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      --model Qwen/Qwen2.5-VL-7B-Instruct
      --dtype bfloat16
      --gpu-memory-utilization 0.80
      --max-model-len 4096
      --trust-remote-code
      --limit-mm-per-prompt image=1
